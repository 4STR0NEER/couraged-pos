<!doctype html>
<!-- Temporary: finds which part of the receipt print path makes the Xprinter feed blank paper. Delete once fixed. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Print test</title>
<style>
body { font: 16px/1.4 system-ui, sans-serif; margin: 16px; max-width: 520px }
button { display: block; width: 100%; margin: 10px 0; padding: 14px; font: inherit; font-weight: 700; text-align: left; border: 1px solid #000; border-radius: 8px; background: #fff; color: #000 }
small { display: block; font-weight: 400 }
@media print { .ui { display: none } }
</style></head><body>
<div class="ui">
<h1>Receipt print test</h1>
<p>Press each button, print to the XP-58, and note which ones come out <b>printed</b> and which come out <b>blank</b>.</p>
<button onclick="go('A')">A. Plain text, this page<small>No frame, no page size, no logo</small></button>
<button onclick="go('B')">B. Plain text, hidden frame<small>Same text, printed from a hidden frame like the app does</small></button>
<button onclick="go('C')">C. Hidden frame + exact page size<small>B plus the measured 58mm page size</small></button>
<button onclick="go('D')">D. Hidden frame + page size + logo<small>C plus the inverted logo (closest to the real receipt)</small></button>
<button onclick="go('E')">E. Frame + page size, logo without filter<small>D but the logo is not inverted</small></button>
</div>
<div id="here"></div>
<script>
var body = function (label, logo) {
  return '<div style="width:48mm;margin:0 auto;padding:2mm 0 10mm;font:9pt/1.3 Arial,sans-serif;color:#000">' +
    (logo ? '<img src="' + location.origin + '/assets/logo.jpg" style="display:block;width:18mm;margin:0 auto 1mm;' + (logo === 'filter' ? 'filter:grayscale(1) invert(1) contrast(2)' : '') + '">' : '') +
    '<div style="text-align:center;font-weight:700;font-size:11pt">TEST ' + label + '</div>' +
    '<div>1 x Day pass ........ 150</div><div>2 x Water ........... 100</div>' +
    '<div style="font-weight:700">TOTAL ............... 250</div>' +
    '<div style="text-align:center">Thank you!</div></div>'
}
function go(v) {
  if (v === 'A') {
    document.getElementById('here').innerHTML = body('A')
    window.print()
    return
  }
  var frame = document.createElement('iframe')
  frame.style.cssText = 'position:fixed;left:-1000mm;top:0;width:58mm;height:10mm;border:0;visibility:hidden'
  var logo = v === 'D' ? 'filter' : v === 'E' ? 'plain' : ''
  frame.srcdoc = '<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0}</style></head><body>' + body(v, logo) + '</body></html>'
  frame.onload = function () {
    var doc = frame.contentDocument
    if (v !== 'B') {
      var h = Math.ceil(doc.body.getBoundingClientRect().height / (96 / 25.4)) + 1
      var s = doc.createElement('style')
      s.textContent = '@page { size: 58mm ' + h + 'mm; margin: 0 }'
      doc.head.appendChild(s)
    }
    frame.contentWindow.focus()
    frame.contentWindow.print()
    setTimeout(function () { frame.remove() }, 60000) // kept alive, unlike the app, in case early removal is the cause
  }
  document.body.appendChild(frame)
}
</script>
</body></html>
